apiVersion: v1
kind: Namespace
metadata:
  name: videoonly
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: live-subtitles-config
  namespace: videoonly
  labels:
    app: live-subtitles
data:
  LSS_HOST: "0.0.0.0"
  LSS_PORT: "8000"
  LSS_LOG_LEVEL: "INFO"
  LSS_API_PREFIX: "/api/v1"
  LSS_PUBLIC_HTTP_BASE_URL: "http://185.70.96.4:8000"
  LSS_PUBLIC_WS_BASE_URL: "ws://185.70.96.4:8000"
  LSS_CORS_ALLOWED_ORIGINS: "https://panelpp.mediatriple.net,http://panelpp.mediatriple.net"
  LSS_DEFAULT_TRANSCRIPTION_MODEL: "medium"
  LSS_TRANSCRIPTION_DEVICE: "cpu"
  LSS_TRANSCRIPTION_COMPUTE_TYPE: "int8"
  LSS_TRANSCRIPTION_BEAM_SIZE: "1"
  LSS_TRANSCRIPTION_CONDITION_ON_PREVIOUS_TEXT: "false"
  LSS_TRANSCRIPTION_VAD_FILTER: "true"
  LSS_TRANSCRIPTION_LANGUAGE_LOCK_MIN_PROBABILITY: "0.8"
  LSS_WHISPER_DOWNLOAD_ROOT: "/app/.cache/whisper"
  LSS_SAMPLE_RATE: "16000"
  LSS_CHUNK_SECONDS: "4.0"
  LSS_OVERLAP_SECONDS: "0.75"
  LSS_MAX_SEGMENTS_PER_STREAM: "500"
  LSS_CHUNK_QUEUE_SIZE: "4"
  LSS_SUBSCRIBER_QUEUE_SIZE: "50"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: live-subtitles-whisper-cache
  namespace: videoonly
  labels:
    app: live-subtitles
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-subtitles
  namespace: videoonly
  labels:
    app: live-subtitles
spec:
  replicas: 1
  minReadySeconds: 5
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: live-subtitles
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: live-subtitles
    spec:
      imagePullSecrets:
        - name: my-dockerhub-secret
      terminationGracePeriodSeconds: 60
      containers:
        - name: live-subtitles
          image: mediatriple/live-subtitle-generator:0.1.3
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: live-subtitles-config
          volumeMounts:
            - name: whisper-cache
              mountPath: /app/.cache/whisper
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
      volumes:
        - name: whisper-cache
          persistentVolumeClaim:
            claimName: live-subtitles-whisper-cache
---
apiVersion: v1
kind: Service
metadata:
  name: live-subtitles
  namespace: videoonly
  labels:
    app: live-subtitles
spec:
  type: ClusterIP
  externalIPs:
    - 185.70.96.4
  selector:
    app: live-subtitles
  ports:
    - name: http
      port: 8000
      targetPort: http
