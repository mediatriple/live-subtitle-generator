[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "live-subtitle-service"
version = "0.1.1"
description = "Realtime subtitle generation service for live streams using ffmpeg and local Whisper models."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "faster-whisper>=1.1.0,<2.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "numpy>=1.26.0,<3.0.0",
  "pydantic-settings>=2.8.0,<3.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.25.0,<1.0.0",
  "pytest-cov>=6.0.0,<7.0.0",
  "ruff>=0.11.0,<1.0.0",
]

[project.scripts]
live-subtitle-service = "live_subtitle_service.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/live_subtitle_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/live_subtitle_service/api/router.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["live_subtitle_service"]
